name: Windows & Linux

on:
  push:
    branches: [main]
    paths: ["dotnet/**", "windows/**", "linux/**", "scripts/**", "Fluester.sln", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["dotnet/**", "windows/**", "linux/**", "scripts/**", "Fluester.sln", ".github/workflows/dotnet.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Versionsnummer für das Paket"
        type: string
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SAMPLE_WAV: https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
  BASE_MODEL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin

jobs:
  linux:
    name: Linux – Tests, Pakete, Selbsttest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests (gemeinsame Logik)
        run: dotnet test dotnet/Fluester.Core.Tests -c Release

      - name: Pakete bauen (x64 + arm64)
        run: |
          scripts/package-dotnet.sh linux-x64 "${{ inputs.version || format('0.0.{0}', github.run_number) }}" dist
          scripts/package-dotnet.sh linux-arm64 "${{ inputs.version || format('0.0.{0}', github.run_number) }}" dist
          file dist/linux-arm64/fluester

      - name: Testumgebung (uinput, Xvfb, Zwischenablage, Sprache, Modell, GTK 4 + libadwaita)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xclip xdotool espeak-ng libgtk-4-1 libadwaita-1-0 desktop-file-utils
          sudo modprobe uinput
          ls -la /dev/uinput
          mkdir -p "$RUNNER_TEMP/fhome/models"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/fhome/models/ggml-base.bin" "$BASE_MODEL"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/jfk.wav" "$SAMPLE_WAV"

      - name: Selbsttest (Taste über uinput/evdev, Zwischenablage, Flow-Leiste, App-Fenster, echte Spracherkennung)
        timeout-minutes: 10
        run: |
          sudo -E env "PATH=$PATH" \
            FLUESTER_HOME="$RUNNER_TEMP/fhome" \
            FLUESTER_SELFTEST_INPUT=1 FLUESTER_SELFTEST_CLIPBOARD=1 FLUESTER_SELFTEST_OVERLAY=1 FLUESTER_SELFTEST_APP=1 \
            FLUESTER_SELFTEST_WHISPER=base FLUESTER_SELFTEST_WAV="$RUNNER_TEMP/jfk.wav" FLUESTER_SELFTEST_EXPECT=country \
            xvfb-run -a dist/linux-x64/fluester selftest

      - name: Bilder der Flow-Leiste
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Leiste-Linux
          path: ${{ runner.temp }}/fhome/selftest-leiste-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Bilder des App-Fensters
        uses: actions/upload-artifact@v4
        with:
          name: App-Fenster-Linux
          path: ${{ runner.temp }}/fhome/selftest-app/*.png
          if-no-files-found: error
          retention-days: 14

      - name: App-Menü-Eintrag (fluester integrate)
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          dist/linux-x64/fluester integrate
          desktop-file-validate "$XDG_DATA_HOME/applications/io.github.kimjongunnk.Fluester.desktop"
          grep -q "^Exec=$PWD/dist/linux-x64/fluester app" "$XDG_DATA_HOME/applications/io.github.kimjongunnk.Fluester.desktop"
          test -s "$XDG_DATA_HOME/icons/hicolor/scalable/apps/io.github.kimjongunnk.Fluester.svg"
          xvfb-run -a dist/linux-x64/fluester app --check

      - name: Mikrofon-Auswahl (virtuelle Mikrofone über PulseAudio)
        run: |
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio -D --exit-idle-time=-1 -n --load=module-native-protocol-unix
          sleep 1
          pactl load-module module-sine-source source_name=fluester_sine rate=16000 frequency=440 source_properties=device.description=Sinus-Mikrofon
          pactl load-module module-null-source source_name=fluester_stille
          pactl load-module module-null-sink sink_name=lautsprecher
          pactl set-default-source fluester_sine
          export FLUESTER_HOME="$RUNNER_TEMP/mic-home"
          f=dist/linux-x64/fluester

          echo "::group::Liste ohne Lautsprecher-Monitor"
          $f mic list | tee mics.txt
          grep -q "Sinus-Mikrofon" mics.txt
          if grep -qi "monitor" mics.txt; then echo "Monitor gelistet"; exit 1; fi
          echo "::endgroup::"

          echo "::group::Gewähltes Mikrofon wird wirklich aufgenommen"
          $f mic sinus
          $f mic test --seconds 1
          $f mic fluester_stille
          if $f mic test --seconds 1; then echo "Stilles Mikrofon als Ton erkannt"; exit 1; fi
          echo "::endgroup::"

          echo "::group::Abgestecktes Mikrofon → Systemstandard"
          python3 -c "import json,os; p=os.environ['FLUESTER_HOME']+'/settings.json'; d=json.load(open(p)); d['microphoneId']='abgesteckt'; json.dump(d,open(p,'w'))"
          $f mic test --seconds 1 | tee fallback.txt
          grep -q "nicht angeschlossen" fallback.txt
          echo "::endgroup::"

          echo "::group::Laufender Dienst übernimmt die Wahl sofort"
          $f mic 1
          $f run --background > daemon.txt 2>&1 &
          for i in $(seq 30); do $f status > /dev/null && break; sleep 0.3; done
          $f status
          $f mic fluester_stille
          sleep 1
          $f status | tee status.txt
          grep -q "Mikrofon:  Null" status.txt
          $f stop
          echo "::endgroup::"

      - name: Tastatur-Zugriff (Gruppe input, ohne Neuanmelden)
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          export FLUESTER_HOME="$RUNNER_TEMP/input-home"
          f=dist/linux-x64/fluester
          ls -l /dev/input/ | head -20
          for i in $(seq 30); do $f status > /dev/null || break; sleep 0.3; done

          echo "::group::Nicht in der Gruppe → klare Meldung"
          $f start
          sleep 2
          $f status | tee before.txt
          grep -q "nicht in der Gruppe „input“" before.txt
          $f stop
          echo "::endgroup::"

          echo "::group::Eingetragen, Anmeldung noch alt → fluester start nimmt sg input"
          sudo usermod -aG input "$(id -un)"
          $f selftest 2>&1 | grep "Gruppe „input“" | tee group.txt
          grep -q "eingetragen" group.txt
          for i in $(seq 30); do $f status > /dev/null || break; sleep 0.3; done
          $f start
          sleep 2
          $f status | tee after.txt
          pid=$(pgrep -u "$(id -un)" -f "fluester run" | head -1)
          grep Groups "/proc/$pid/status"
          grep -qw "$(getent group input | cut -d: -f3)" <(grep Groups "/proc/$pid/status")
          if grep -Eq "Kein Zugriff auf (die Tastatur|/dev/input)" after.txt; then echo "Tastatur trotz sg nicht lesbar"; exit 1; fi
          $f stop
          echo "::endgroup::"

      - name: Ende-zu-Ende – mehrere Diktate hintereinander (echte Taste, Mikrofon, Whisper, Einfügen)
        timeout-minutes: 10
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          export FLUESTER_HOME="$RUNNER_TEMP/e2e-home"
          f="$PWD/dist/linux-x64/fluester"
          mkdir -p "$FLUESTER_HOME/models"
          cp "$RUNNER_TEMP/fhome/models/ggml-base.bin" "$FLUESTER_HOME/models/"
          # Sprache als Mikrofon: jfk.wav läuft in Schleife in einen virtuellen Lautsprecher, dessen Monitor ist das Mikrofon
          pactl load-module module-null-sink sink_name=sprecher
          pactl set-default-sink lautsprecher
          (while true; do paplay --device=sprecher "$RUNNER_TEMP/jfk.wav"; done) &
          # X11 für Zwischenablage und aktives Fenster; die virtuelle Tastatur des Dienstes braucht /dev/uinput
          Xvfb :77 -screen 0 1280x800x24 &
          export DISPLAY=:77
          sudo chmod 666 /dev/uinput
          printf '%s' '{ "whisperModelId": "base", "language": "en-US", "cleanup": "rules", "microphoneId": "sprecher.monitor", "onboardingDone": true }' > "$FLUESTER_HOME/settings.json"
          sleep 1

          # Start wie bei Nutzern: fluester start (hier mit frisch eingetragener Gruppe input → über sg), aus einer Shell, die danach endet
          bash -c "$f start"
          sleep 3
          $f status
          # Eigene Test-Tastatur (wie echte Hardware) hält Strg rechts dreimal je 3 s
          "$f" e2e-keys 3 3 12
          $f status | tee status.txt
          count=$(python3 -c "import json,os; h=json.load(open(os.environ['FLUESTER_HOME']+'/history.json')); print(len(h if isinstance(h,list) else h.get('items',[])))")
          echo "Diktate im Verlauf: $count"
          grep -E "Flow-Leiste|Aufnahme|Diktat|Erkennung|Fehler|hängt|Wächter|ABSTURZ|SIG" "$FLUESTER_HOME/fluester.log" || true
          test "$count" -eq 3
          # Die Flow-Leiste lief mit (X11), nicht der Rückfall auf Benachrichtigungen
          grep -q "Flow-Leiste: screen" "$FLUESTER_HOME/fluester.log"
          # Nur kurz getippt: kein Diktat, aber ein Hinweis statt Stille
          "$f" e2e-keys 1 0.1 3
          grep -q "Nur kurz getippt" "$FLUESTER_HOME/fluester.log"
          grep -q "Flüster läuft · bereit" status.txt

          # Zweite Runde in einem neuen Schritt-Shell-Prozess: Dienst muss weiterlaufen (Terminal zu ≠ Flüster aus)
          "$f" e2e-keys 1 3 12
          count=$(python3 -c "import json,os; h=json.load(open(os.environ['FLUESTER_HOME']+'/history.json')); print(len(h if isinstance(h,list) else h.get('items',[])))")
          echo "Diktate im Verlauf: $count"
          test "$count" -eq 4
          $f stop

      - name: Installer testen
        run: |
          FLUESTER_TARBALL=dist/Fluester-Linux-x64.tar.gz FLUESTER_NO_SETUP=1 bash scripts/install.sh
          ~/.local/bin/fluester version
          ~/.local/bin/fluester help | head -3
          test -f ~/.local/share/applications/io.github.kimjongunnk.Fluester.desktop
          test -f ~/.local/share/icons/hicolor/scalable/apps/io.github.kimjongunnk.Fluester.svg
          bash scripts/install.sh --uninstall
          test ! -e ~/.local/bin/fluester
          test ! -e ~/.local/share/applications/io.github.kimjongunnk.Fluester.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: Fluester-Linux
          path: dist/Fluester-Linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows – Tests, Paket, Selbsttest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests (gemeinsame Logik)
        run: dotnet test dotnet/Fluester.Core.Tests -c Release

      - name: Paket bauen
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ inputs.version || format('0.0.{0}', github.run_number) }}" -Out dist

      - name: Modell und Testaudio
        shell: pwsh
        run: |
          $models = Join-Path $env:LOCALAPPDATA 'Fluester\models'
          New-Item -ItemType Directory -Force -Path $models | Out-Null
          Invoke-WebRequest $env:BASE_MODEL -OutFile (Join-Path $models 'ggml-base.bin')
          Invoke-WebRequest $env:SAMPLE_WAV -OutFile "$env:RUNNER_TEMP\jfk.wav"

      - name: Selbsttest (Taste, Einfügen, DPAPI, Autostart, Leiste, echte Spracherkennung)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:FLUESTER_SELFTEST_WHISPER = 'base'
          $env:FLUESTER_SELFTEST_WAV = "$env:RUNNER_TEMP\jfk.wav"
          $env:FLUESTER_SELFTEST_EXPECT = 'country'
          $env:FLUESTER_SELFTEST_INSERT = '1'
          $env:FLUESTER_SELFTEST_LOG = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath dist\win-x64\Fluester.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          Get-Content $env:FLUESTER_SELFTEST_LOG -Encoding UTF8
          if ($p.ExitCode -ne 0) { Write-Host "Exit $($p.ExitCode)"; Get-Content "$env:LOCALAPPDATA\Fluester\fluester.log" -Tail 40 -ErrorAction SilentlyContinue; exit 1 }

      - name: Installer testen (installieren, starten, läuft?, deinstallieren)
        shell: pwsh
        run: |
          $env:FLUESTER_ZIP = (Resolve-Path dist\Fluester-Windows-x64.zip).Path
          $env:FLUESTER_NO_START = '1'
          & .\scripts\install.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Fluester\Fluester.exe'
          if (-not (Test-Path $exe)) { throw 'nicht installiert' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Fluester')) { throw 'kein Eintrag unter Apps' }
          Start-Process $exe -ArgumentList '--background'
          Start-Sleep -Seconds 8
          $proc = Get-Process -Name Fluester -ErrorAction SilentlyContinue
          if (-not $proc) { Get-Content "$env:LOCALAPPDATA\Fluester\fluester.log" -Tail 30 -ErrorAction SilentlyContinue; throw 'Fluester laeuft nicht' }
          Write-Host "OK Fluester laeuft (PID $($proc.Id))"
          & .\scripts\install.ps1 -Uninstall
          if (Test-Path $exe) { throw 'nicht entfernt' }

      - uses: actions/upload-artifact@v4
        with:
          name: Fluester-Windows
          path: dist/Fluester-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

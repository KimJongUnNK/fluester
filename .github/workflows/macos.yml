name: macOS

on:
  push:
    branches: [main]
    paths: ["macos/**", "scripts/install.sh", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "scripts/install.sh", ".github/workflows/macos.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Versionsnummer für das Paket"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Testen, bauen, Selbsttest
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Tests (FluesterCore)
        run: swift test

      - name: App bauen
        run: VERSION="${{ inputs.version || format('0.0.{0}', github.run_number) }}" BUILD="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Bundle prüfen
        run: |
          plutil -lint "build/Flüster.app/Contents/Info.plist"
          file "build/Flüster.app/Contents/MacOS/Fluester"
          codesign --verify --verbose=1 "build/Flüster.app"

      - name: whisper.cpp für den Selbsttest
        run: |
          brew install whisper-cpp
          MODELS="$HOME/Library/Application Support/Fluester/models"
          mkdir -p "$MODELS"
          curl -sSL --retry 3 -o "$MODELS/ggml-base.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          # Echte Sprachaufnahme als Testaudio – verlässlicher als `say`, das auf frischen CI-Macs manchmal leer bleibt
          curl -sSL --retry 3 -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav

      - name: Selbsttest (echte Spracherkennung mit Whisper + Apple)
        timeout-minutes: 15
        run: |
          FLUESTER_SELFTEST_WHISPER=base FLUESTER_SELFTEST_WAV="$RUNNER_TEMP/jfk.wav" FLUESTER_SELFTEST_EXPECT=country \
            "build/Flüster.app/Contents/MacOS/Fluester" --selftest || {
            echo "--- whisper-server.log ---"
            cat "$HOME/Library/Application Support/Fluester/whisper-server.log" || true
            exit 1
          }

      - name: Installer testen (installieren, starten, läuft?, deinstallieren)
        working-directory: .
        run: |
          FLUESTER_ZIP=macos/build/Fluester-macOS.zip bash scripts/install.sh
          test -x "/Applications/Flüster.app/Contents/MacOS/Fluester"
          sleep 6
          pgrep -x Fluester >/dev/null && echo "✓ Flüster läuft nach dem Start" || { echo "✗ Flüster läuft nicht"; exit 1; }
          pkill -x Fluester || true
          bash scripts/install.sh --uninstall
          test ! -e "/Applications/Flüster.app"

      - name: Update aus der App (an Ort und Stelle ersetzen, keine zweite Kopie)
        working-directory: .
        run: |
          T="$RUNNER_TEMP/update-test"; mkdir -p "$T"
          ditto "macos/build/Flüster.app" "$T/Flüster.app"
          echo alt > "$T/Flüster.app/Contents/Resources/nur-in-alter-version.txt"
          LOG="$HOME/Library/Application Support/Fluester/update.log"; rm -f "$LOG"
          "$T/Flüster.app/Contents/MacOS/Fluester" --apply-update macos/build/Fluester-macOS.zip
          for _ in $(seq 60); do grep -q "Update:" "$LOG" 2>/dev/null && break; sleep 1; done
          cat "$LOG"
          grep -q "Update: fertig" "$LOG"
          test ! -e "$T/Flüster.app/Contents/Resources/nur-in-alter-version.txt"
          test -x "$T/Flüster.app/Contents/MacOS/Fluester"
          test ! -e "$T/Flüster.app.alt"
          [ "$(find "$T" -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')" = 1 ]
          codesign --verify "$T/Flüster.app"
          sleep 3; pkill -x Fluester || true
          echo "✓ an Ort und Stelle ersetzt, keine zweite Kopie"

      - uses: actions/upload-artifact@v4
        with:
          name: Fluester-macOS
          path: macos/build/Fluester-macOS.zip
          if-no-files-found: error
          retention-days: 14

name: Release

# Neue Version veröffentlichen:
#   1. CHANGELOG.md um einen Abschnitt "## [1.2.3]" ergänzen
#   2. Actions › Release › "Run workflow" › Version 1.2.3 eintragen
#      (oder: git tag v1.2.3 && git push origin v1.2.3)
# Baut und prüft macOS, Windows und Linux (inkl. echter Spracherkennung), veröffentlicht alle Pakete
# in einem Release und testet danach die Installation so, wie Nutzer sie machen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 1.2.3"
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Ungültige Version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows-linux:
    needs: version
    uses: ./.github/workflows/dotnet.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Veröffentlichen
    needs: [version, macos, windows-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen und Release-Text
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          ls -la
          sha256sum Fluester-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/changes.md
          R="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts"
          {
            echo "## Installieren"
            echo
            echo "**macOS** (Apple-Chip, macOS 14+) und **Linux** (x64/arm64) – im Terminal:"
            echo '```bash'
            echo "curl -fsSL $R/install.sh | bash"
            echo '```'
            echo "**Windows** (10/11, 64 Bit) – in PowerShell:"
            echo '```powershell'
            echo "irm $R/install.ps1 | iex"
            echo '```'
            echo "Oder die Datei für dein System unten laden. Schritt für Schritt: [macOS](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/macos.md) · [Windows](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/windows.md) · [Linux](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/linux.md)"
            echo
            if [ -s dist/changes.md ]; then
              echo "## Neu in $VERSION"
              cat dist/changes.md
            fi
          } > dist/notes.md
          cat dist/notes.md
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Flüster $VERSION" --notes-file dist/notes.md \
            dist/Fluester-macOS.zip dist/Fluester-Windows-x64.zip dist/Fluester-Linux-x64.tar.gz dist/Fluester-Linux-arm64.tar.gz dist/SHA256SUMS.txt

  verify-macos:
    name: Prüfen – macOS-Download
    needs: [version, publish]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 10
          FLUESTER_REPO="$GITHUB_REPOSITORY" bash scripts/install.sh
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "/Applications/Flüster.app/Contents/Info.plist" | grep -x "${{ needs.version.outputs.version }}"
          pkill -x Fluester || true

  verify-windows:
    name: Prüfen – Windows-Download
    needs: [version, publish]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Start-Sleep -Seconds 10
          $env:FLUESTER_REPO = $env:GITHUB_REPOSITORY
          $env:FLUESTER_NO_START = '1'
          & .\scripts\install.ps1
          $v = (Get-Item "$env:LOCALAPPDATA\Programs\Fluester\Fluester.exe").VersionInfo.ProductVersion
          Write-Host "Installiert: $v"
          if (-not $v.StartsWith('${{ needs.version.outputs.version }}')) { throw "falsche Version" }

  verify-linux:
    name: Prüfen – Linux-Download
    needs: [version, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 10
          FLUESTER_REPO="$GITHUB_REPOSITORY" FLUESTER_NO_SETUP=1 bash scripts/install.sh
          ~/.local/bin/fluester version | grep "${{ needs.version.outputs.version }}"

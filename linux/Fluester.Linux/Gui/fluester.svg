    <rect x="70.625" y="39.200" width="5.75" height="49.600" rx="2.875"/>
    <rect x="80.125" y="44.900" width="5.75" height="38.200" rx="2.875"/>
    <rect x="89.625" y="50.600" width="5.75" height="26.800" rx="2.875"/>
